<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Companies - Accrual Automation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Accrual Automation</span>
            </div>
            <nav class="nav">
                <a href="/" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/process-emails" class="nav-link">
                    <i class="fas fa-envelope"></i> Process Emails
                </a>
                <a href="/companies" class="nav-link active">
                    <i class="fas fa-building"></i> Companies
                </a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="page-title">
                <i class="fas fa-building mr-2"></i>
                Company Management
            </h1>

            <!-- Update Folder Structures Section -->
            <div class="card p-6 mb-6">
                <h2 class="font-bold text-xl mb-4">
                    <i class="fas fa-folder-tree text-pink-500 mr-2"></i>
                    Folder Structure Management
                </h2>
                <p class="mb-4" style="color: var(--text-secondary);">
                    Validate and create missing folders for all companies based on their entity type (India/US).
                </p>
                <button id="updateAllFolders" class="btn btn-primary">
                    <i class="fas fa-sync-alt mr-2"></i>
                    Update All Folder Structures
                </button>
            </div>

            <!-- Status Card -->
            <div id="statusCard" class="card p-6 hidden mb-6">
                <h3 class="font-bold mb-4 flex items-center" id="statusTitle">
                    <i class="fas fa-spinner fa-spin text-pink-500 mr-2"></i>
                    Processing...
                </h3>
                <div id="statusContent">
                    <div class="bg-gray-900 rounded-lg p-4 font-mono text-sm max-h-96 overflow-y-auto" id="logOutput">
                    </div>
                </div>
            </div>

            <!-- Companies List -->
            <div class="card p-6">
                <h2 class="font-bold text-xl mb-4">
                    <i class="fas fa-list text-pink-500 mr-2"></i>
                    All Companies
                </h2>
                <div id="companiesList" class="space-y-4">
                    <div class="text-center" style="color: var(--text-secondary);">
                        <i class="fas fa-spinner fa-spin text-2xl"></i>
                        <p class="mt-2">Loading companies...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const statusCard = document.getElementById('statusCard');
        const statusTitle = document.getElementById('statusTitle');
        const logOutput = document.getElementById('logOutput');
        const companiesList = document.getElementById('companiesList');
        const updateAllBtn = document.getElementById('updateAllFolders');

        // Load companies on page load
        async function loadCompanies() {
            try {
                const response = await fetch('/get-companies');
                const companies = await response.json();

                companiesList.innerHTML = Object.entries(companies).map(([name, info]) => `
                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg">${name}</h3>
                                <p class="text-sm" style="color: var(--text-secondary);">
                                    <span class="inline-block bg-pink-100 dark:bg-pink-900 text-pink-800 dark:text-pink-200 px-2 py-1 rounded text-xs mr-2">
                                        ${info.entity_type === 'india' ? '🇮🇳 India' : '🇺🇸 US'}
                                    </span>
                                    <span class="inline-block bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded text-xs">
                                        FY: ${info.financial_year}
                                    </span>
                                </p>
                                <p class="text-sm mt-2" style="color: var(--text-secondary);">
                                    <strong>Aliases:</strong> ${info.aliases.join(', ')}
                                </p>
                            </div>
                            <button class="btn-update-folder text-sm" data-entity="${name}">
                                <i class="fas fa-folder-plus mr-1"></i>
                                Update Folders
                            </button>
                        </div>
                    </div>
                `).join('');

                // Add event listeners to individual update buttons
                document.querySelectorAll('.btn-update-folder').forEach(btn => {
                    btn.addEventListener('click', () => updateFolders([btn.dataset.entity]));
                });

            } catch (error) {
                companiesList.innerHTML = `
                    <div class="text-center text-red-500">
                        <i class="fas fa-exclamation-circle text-2xl"></i>
                        <p class="mt-2">Error loading companies: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Update folder structures
        async function updateFolders(entities = []) {
            statusCard.classList.remove('hidden');
            updateAllBtn.disabled = true;
            logOutput.innerHTML = '';

            statusTitle.innerHTML = '<i class="fas fa-spinner fa-spin text-pink-500 mr-2"></i>Updating Folder Structures...';

            const entityText = entities.length === 0 ? 'all companies' : entities.join(', ');
            addLog(`🚀 Starting folder structure update for ${entityText}...`);

            try {
                const response = await fetch('/update-folder-structures', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entities })
                });

                const result = await response.json();

                if (result.status === 'completed') {
                    statusTitle.innerHTML = '<i class="fas fa-check-circle text-green-500 mr-2"></i>Update Complete!';

                    result.results.forEach(res => {
                        if (res.status === 'completed') {
                            addLog(`✅ ${res.entity}: ${res.message}`, 'text-green-400');
                        } else {
                            addLog(`❌ ${res.entity}: ${res.message}`, 'text-red-400');
                        }
                    });
                } else {
                    throw new Error('Update failed');
                }
            } catch (error) {
                statusTitle.innerHTML = '<i class="fas fa-exclamation-circle text-red-500 mr-2"></i>Error';
                addLog(`❌ Error: ${error.message}`, 'text-red-400');
            }

            updateAllBtn.disabled = false;
        }

        function addLog(message, className = 'text-green-400') {
            const logLine = document.createElement('div');
            logLine.textContent = message;
            logLine.className = className + ' leading-relaxed';
            logOutput.appendChild(logLine);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Event listeners
        updateAllBtn.addEventListener('click', () => updateFolders([]));

        // Load companies on page load
        loadCompanies();
    </script>
</body>

</html>
